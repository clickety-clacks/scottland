# Desktop portal backends for Scottland sessions (XDG_CURRENT_DESKTOP=Scottland:Wayfire:wlroots;
# xdg-desktop-portal reads this file before wayfire-portals.conf). See portals.conf(5).
#
# Screen sharing and screenshots: xdg-desktop-portal-wlr, which captures through the screencopy
# protocols Wayfire provides, within its documented scope (whole outputs; its own output picker).
# Everything else (file chooser, settings, appearance): xdg-desktop-portal-gtk.
# Secrets: whichever keyring is installed.
# Interfaces no backend can serve on Wayfire stay unavailable, so apps see that instead of a
# backend for another compositor that fails: without these lines xdg-desktop-portal falls back to
# Hyprland's backend for GlobalShortcuts and InputCapture (its UseIn lists wlroots desktops).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring;kwallet
org.freedesktop.impl.portal.Inhibit=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
