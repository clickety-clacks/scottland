name: Scottland 0.4 fast checks

on:
  pull_request:
    branches:
      - '0.4'
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    branches:
      - '0.4'

permissions:
  contents: read

jobs:
  build:
    name: Scottland 0.3 build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow vulkan-headers wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              pacman -Q
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Build plugin and command tools
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              git rev-parse HEAD
              git rev-parse HEAD^{tree}
              make test-hooks
            '

  unit:
    name: Scottland 0.3 unit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon lua mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              pacman -Q
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Run the unit suite
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              git rev-parse HEAD
              git rev-parse HEAD^{tree}
              make tools-test
              tests/inertia-unit.sh
              tests/navigation-unit.sh
              tests/pairing-unit.sh
              tests/peek-unit.sh
              tests/rail-make-room-unit.sh
              tests/spread-unit.sh
              tests/windowing-unit.sh
              python3 tests/omarchy-luahost-noop-list-test.py
              python3 tests/output-scale-unit.py
              mkdir -p build
              g++ -std=c++17 -Wall -Wextra -Werror -O2 -Icore/plugin/src \
                tests/cycle-spring-unit.cpp -o build/cycle-spring-unit
              build/cycle-spring-unit
            '

  headless:
    name: Scottland 0.3 headless
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize OSD foundation evidence
        run: python3 tests/osd-foundation-smoke.py --initialize

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'SCOTTLAND_BASE_IMAGE_REF=%s\n' "$base_ref" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus foot gdk-pixbuf2 git glm grim gtk4 gtk4-layer-shell imagemagick inotify-tools jq lua \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow vulkan-headers wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE
          image_id="$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"
          printf 'SCOTTLAND_CHECKS_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$image_id"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env SCOTTLAND_CHECKS_IMAGE_ID \
            --env SCOTTLAND_BASE_IMAGE_REF \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              python3 tests/osd-foundation-smoke.py --record-versions
              pacman -Q wayfire wlroots0.20 meson gcc rust python bubblewrap quickshell gtk4-layer-shell imagemagick foot lua
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
              bwrap --version
            '

      - name: Run the headless check
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            --env SCOTTLAND_HEADLESS_ISOLATION=1 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              mkdir -m 700 -p "$XDG_RUNTIME_DIR"
              git rev-parse HEAD
              mkdir -p build/osd-foundation-smoke
              if make test-hooks; then
                printf "PASS\\tmake test-hooks exited 0 (includes the Meson plugin build)\\n" >build/osd-foundation-smoke/hooks-build.outcome
              else
                status=$?
                printf "FAIL\\tmake test-hooks exited %s\\n" "$status" >build/osd-foundation-smoke/hooks-build.outcome
                exit "$status"
              fi
              mkdir -m 700 build/queue-headless-scratch
              SCOTTLAND_TEST_SCRATCH="$PWD/build/queue-headless-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/queue-headless-scratch/session" \
                tests/transparency-toggle-test.sh "$PWD/build/queue-headless-evidence"
              rmdir -- build/queue-headless-scratch
              rm -f build/middle-press-fast-check-failed
              mkdir -m 700 build/middle-press-fast-check-scratch
              middle_log="$PWD/build/middle-press-console.log"
              if SCOTTLAND_TEST_SCRATCH="$PWD/build/middle-press-fast-check-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/middle-press-fast-check-scratch/session" \
                timeout --signal=TERM --kill-after=30s 6m \
                tests/middle-press-test.sh "$PWD/build/middle-press-evidence" >"$middle_log" 2>&1; then
                cat "$middle_log"
              else
                test_status=$?
                cat "$middle_log"
                touch build/middle-press-fast-check-failed
                exit "$test_status"
              fi
              rmdir -- build/middle-press-fast-check-scratch
              mkdir -m 700 build/fast-checks-headless-scratch
              console_log="$PWD/build/hint-background-opacity-console.log"
              if SCOTTLAND_WIDGET_SCOPE=0 \
                SCOTTLAND_TEST_SCRATCH="$PWD/build/fast-checks-headless-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/fast-checks-headless-scratch/session" \
                timeout --signal=TERM --kill-after=30s 6m tests/hint-background-opacity-test.sh >"$console_log" 2>&1; then
                cat "$console_log"
              else
                test_status=$?
                cat "$console_log"
                exit "$test_status"
              fi
              rmdir -- build/fast-checks-headless-scratch
              mkdir -m 700 build/config-watch-scratch
              SCOTTLAND_TEST_SCRATCH="$PWD/build/config-watch-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/config-watch-scratch/session" \
                timeout --signal=TERM --kill-after=30s 2m \
                tests/config-watch-missing-settings-test.sh "$PWD/build/config-watch-evidence"
              rmdir -- build/config-watch-scratch
              mkdir -m 700 build/widgets-fast-check-scratch
              widgets_log="$PWD/build/widgets-fast-check-scratch/widgets-test.log"
              if SCOTTLAND_TEST_SCRATCH="$PWD/build/widgets-fast-check-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/widgets-fast-check-scratch/session" \
                tests/widgets-test.sh >"$widgets_log" 2>&1; then
                cat "$widgets_log"
              else
                test_status=$?
                cat "$widgets_log"
                exit "$test_status"
              fi
              mkdir -m 700 build/omarchy-global-actions-scratch
              SCOTTLAND_TEST_SCRATCH="$PWD/build/omarchy-global-actions-scratch" \
                timeout --signal=TERM --kill-after=30s 2m \
                python3 tests/omarchy-global-actions-test.py
            '

      - name: Upload middle-press events on failure
        if: ${{ always() && !cancelled() && hashFiles('build/middle-press-fast-check-failed') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: middle-press-events-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/middle-press-evidence/buttons.jsonl
            build/middle-press-evidence/pointer.jsonl
          if-no-files-found: warn

      - name: Upload widget suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/widgets-fast-check-scratch/widgets-test.log
            build/widgets-fast-check-scratch/session.results/
            build/widgets-fast-check-scratch/session/wayfire.log
            build/widgets-fast-check-scratch/session/.headless-start-failure.txt
            build/widgets-fast-check-scratch/session/.headless-start-stderr.log
          if-no-files-found: warn

      - name: Run OSD foundation smoke
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          if docker image inspect scottland-checks:phase1 >/dev/null 2>&1; then
            docker run --rm --privileged \
              --user "$(id -u):$(id -g)" \
              --env HOME=/home/ci \
              --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
              --env SCOTTLAND_HEADLESS_ISOLATION=1 \
              --env GITHUB_REPOSITORY \
              --env GITHUB_RUN_ID \
              --env GITHUB_RUN_ATTEMPT \
              --env GITHUB_SERVER_URL \
              --env GITHUB_SHA \
              --env GITHUB_REF \
              --env GITHUB_EVENT_NAME \
              --env GITHUB_BASE_REF \
              --env GITHUB_HEAD_REF \
              --env SCOTTLAND_CHECKS_IMAGE_ID \
              --env SCOTTLAND_BASE_IMAGE_REF \
              --volume "$GITHUB_WORKSPACE:/work" \
              --workdir /work \
              scottland-checks:phase1 \
              python3 tests/osd-foundation-smoke.py --run
          else
            python3 tests/osd-foundation-smoke.py --not-run \
              --reason 'the headless container image was not prepared; see the preparation step'
          fi

      - name: Upload OSD foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osd-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/osd-foundation-smoke/
          if-no-files-found: warn

      # This label is applied only after independent review of the exact PR head.
      - name: Run reviewed OSD shown-ACK check
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'osd-shown-ack-reviewed' && github.event.pull_request.base.ref == '0.4' && !cancelled() }}
        env:
          SCOTTLAND_PRODUCT_SOURCE: c5d138ef131579c59d8a3eeced2bb93c6e0f2fbd
          SCOTTLAND_PRODUCT_TREE: 74c8b434eb45c0f15d801fca470734b8697d5fae
          SCOTTLAND_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          SCOTTLAND_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOTTLAND_EVENT_ACTION: ${{ github.event.action }}
          SCOTTLAND_SHOWN_ACK_LABEL: ${{ github.event.label.name }}
        run: |
          report=build/osd-shown-ack-evidence/report.json
          if ! docker image inspect scottland-checks:phase1 >/dev/null 2>&1; then
            python3 tests/osd-foundation-smoke.py --initialize --shown-ack --report "$report"
            python3 tests/osd-foundation-smoke.py --not-run \
              --reason 'the hosted component image was unavailable before the shown-ACK step' \
              --report "$report"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$SCOTTLAND_PRODUCT_SOURCE"
          docker run --rm --privileged \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ID \
            --env GITHUB_RUN_ATTEMPT \
            --env GITHUB_SERVER_URL \
            --env GITHUB_SHA \
            --env GITHUB_REF \
            --env GITHUB_EVENT_NAME \
            --env GITHUB_BASE_REF \
            --env GITHUB_HEAD_REF \
            --env SCOTTLAND_PRODUCT_SOURCE \
            --env SCOTTLAND_PRODUCT_TREE \
            --env SCOTTLAND_REVIEWED_HEAD \
            --env SCOTTLAND_PULL_REQUEST_BASE_SHA \
            --env SCOTTLAND_EVENT_ACTION \
            --env SCOTTLAND_SHOWN_ACK_LABEL \
            --env SCOTTLAND_CHECKS_IMAGE_ID \
            --env SCOTTLAND_BASE_IMAGE_REF \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              mkdir -m 700 -p "$XDG_RUNTIME_DIR"
              report=build/osd-shown-ack-evidence/report.json
              python3 tests/osd-foundation-smoke.py --initialize --shown-ack --report "$report"
              python3 tests/osd-foundation-smoke.py --record-versions --report "$report"
              python3 tests/osd-foundation-smoke.py --run --shown-ack --report "$report"
            '

      - name: Upload OSD shown-ACK evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'osd-shown-ack-reviewed' }}
        uses: actions/upload-artifact@v4
        with:
          name: osd-shown-ack-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/osd-shown-ack-evidence/
          if-no-files-found: warn

  standalone:
    name: Scottland 0.4 standalone rows
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare test environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'SCOTTLAND_BASE_IMAGE_DIGEST=%s\n' "$base_ref" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:standalone - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring fakeroot gcc git make python shadow \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:standalone --format '{{.Id}}')"

      - name: Run standalone rows
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env GITHUB_REF \
            --env SCOTTLAND_BASE_IMAGE_DIGEST \
            --env SCOTTLAND_CONTAINER_ID="$(docker image inspect scottland-checks:standalone --format '{{.Id}}')" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:standalone \
            bash .github/scripts/standalone-rows.sh

      - name: Upload per-row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-rows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/standalone-rows/
          if-no-files-found: warn

  compositor_rows:
    name: Scottland 0.4 compositor rows (${{ matrix.mode }}, ${{ matrix.shard }})
    # These rows remain a separate acceptance gate while the hosted renderer
    # and failing behaviors are resolved. A label requests an evidence run.
    if: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'compositor-rows-evidence') || contains(github.event.pull_request.labels.*.name, 'pinned-compositor-evidence')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        # The pinned label also runs the current merge source for comparison.
        mode: ${{ fromJSON(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pinned-compositor-evidence') && '["merge","pinned"]' || '["merge"]') }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.mode == 'pinned' && '4990c79e9066efe33cef683b50287f3b5ff94d55' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare compositor environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'SCOTTLAND_BASE_IMAGE_DIGEST=%s\n' "$base_ref" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:compositor - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus foot gdk-pixbuf2 git glm grim gtk4 gtk4-layer-shell hyprland imagemagick inotify-tools jq \
                libglvnd libinput libxkbcommon lua mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow vulkan-headers wayfire wayland wayland-protocols wf-recorder wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:compositor --format '{{.Id}}')"

      - name: Run compositor rows
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          SCOTTLAND_HARNESS_HEAD: ${{ matrix.mode == 'pinned' && '4990c79e9066efe33cef683b50287f3b5ff94d55' || github.sha }}
          SCOTTLAND_PRODUCT_SOURCE: ${{ matrix.mode == 'pinned' && 'dc155ea158dd8aee14bc9a30f451b7e73316586b' || github.sha }}
          SCOTTLAND_PRODUCT_TREE: ${{ matrix.mode == 'pinned' && '5ea3f22461b820144778512e674d3b632929ba27' || '' }}
          SCOTTLAND_PINNED_EVIDENCE: ${{ matrix.mode == 'pinned' }}
        run: |
          if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
            echo 'Could not enable user namespaces; the compositor preflight will report availability' >&2
          fi
          bash .github/scripts/compositor-rows.sh "${{ matrix.shard }}" 4

      - name: Upload compositor row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-rows-${{ matrix.mode }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/compositor-rows/shard-${{ matrix.shard }}/identity.txt
            build/compositor-rows/shard-${{ matrix.shard }}/harness-diff.txt
            build/compositor-rows/shard-${{ matrix.shard }}/preflight.log
            build/compositor-rows/shard-${{ matrix.shard }}/preflight/goo-state.json
            build/compositor-rows/shard-${{ matrix.shard }}/rows.tsv
            build/compositor-rows/shard-${{ matrix.shard }}/logs/*.log
          if-no-files-found: error
