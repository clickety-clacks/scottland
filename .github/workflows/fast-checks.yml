name: Scottland fast checks

on:
  pull_request:
    branches: [main, '0.3']
  merge_group:
    branches: [main, '0.3']

permissions:
  contents: read

jobs:
  fast-checks:
    # Public fork code must not execute on private self-hosted machines.
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: scottland-ci-x86_64
          - runner: scottland-ci-aarch64
    runs-on: [self-hosted, linux, '${{ matrix.runner }}']
    timeout-minutes: 45
    concurrency:
      group: scottland-fast-${{ matrix.runner }}
      cancel-in-progress: false
    steps:
      - name: Checkout the tested merge result
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact subject
        run: git rev-parse HEAD
      - name: Build, unit tests, and isolated headless smoke
        run: bash ci/fast-checks.sh
