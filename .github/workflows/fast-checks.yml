name: Scottland 0.4 fast checks

on:
  pull_request:
    branches:
      - '0.4'
  merge_group:
    branches:
      - '0.4'

permissions:
  contents: read

jobs:
  build:
    name: Scottland 0.3 build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              pacman -Q
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Build plugin and command tools
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              git rev-parse HEAD
              git rev-parse HEAD^{tree}
              make test-hooks
            '

  unit:
    name: Scottland 0.3 unit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              pacman -Q
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Run the unit suite
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              git rev-parse HEAD
              git rev-parse HEAD^{tree}
              make tools-test
              tests/inertia-unit.sh
              tests/navigation-unit.sh
              tests/pairing-unit.sh
              tests/peek-unit.sh
              tests/rail-make-room-unit.sh
              tests/spread-unit.sh
              tests/windowing-unit.sh
              python3 tests/output-scale-unit.py
              mkdir -p build
              g++ -std=c++17 -Wall -Wextra -Werror -O2 -Icore/plugin/src \
                tests/cycle-spring-unit.cpp -o build/cycle-spring-unit
              build/cycle-spring-unit
            '

  headless:
    name: Scottland 0.3 headless
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --tag scottland-checks:phase1 - <<'DOCKERFILE'
          FROM archlinux:base-devel
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim gtk4 gtk4-layer-shell imagemagick inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE
          printf 'Container base image: %s\n' "$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:phase1 --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python bubblewrap quickshell
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
              bwrap --version
            '

      - name: Run the headless check
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            --env SCOTTLAND_HEADLESS_ISOLATION=1 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:phase1 \
            bash -euo pipefail -c '
              mkdir -m 700 -p "$XDG_RUNTIME_DIR"
              git rev-parse HEAD
              make test-hooks
              mkdir -m 700 build/middle-press-fast-check-scratch
              middle_log="$PWD/build/middle-press-console.log"
              if SCOTTLAND_TEST_SCRATCH="$PWD/build/middle-press-fast-check-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/middle-press-fast-check-scratch/session" \
                timeout --signal=TERM --kill-after=30s 6m \
                tests/middle-press-test.sh "$PWD/build/middle-press-evidence" --skip-cross-surface-replay >"$middle_log" 2>&1; then
                cat "$middle_log"
              else
                test_status=$?
                cat "$middle_log"
                exit "$test_status"
              fi
              rmdir -- build/middle-press-fast-check-scratch
              mkdir -m 700 build/fast-checks-headless-scratch
              console_log="$PWD/build/hint-background-opacity-console.log"
              if SCOTTLAND_WIDGET_SCOPE=0 \
                SCOTTLAND_TEST_SCRATCH="$PWD/build/fast-checks-headless-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/fast-checks-headless-scratch/session" \
                timeout --signal=TERM --kill-after=30s 6m tests/hint-background-opacity-test.sh >"$console_log" 2>&1; then
                cat "$console_log"
              else
                test_status=$?
                cat "$console_log"
                exit "$test_status"
              fi
              rmdir -- build/fast-checks-headless-scratch
              mkdir -m 700 build/config-watch-scratch
              SCOTTLAND_TEST_SCRATCH="$PWD/build/config-watch-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/config-watch-scratch/session" \
                timeout --signal=TERM --kill-after=30s 2m \
                tests/config-watch-missing-settings-test.sh "$PWD/build/config-watch-evidence"
              rmdir -- build/config-watch-scratch
            '

  standalone:
    name: Scottland 0.4 standalone rows
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare test environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'SCOTTLAND_BASE_IMAGE_DIGEST=%s\n' "$base_ref" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:standalone - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring fakeroot gcc git make python shadow \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:standalone --format '{{.Id}}')"

      - name: Run standalone rows
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env GITHUB_REF \
            --env SCOTTLAND_BASE_IMAGE_DIGEST \
            --env SCOTTLAND_CONTAINER_ID="$(docker image inspect scottland-checks:standalone --format '{{.Id}}')" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:standalone \
            bash .github/scripts/standalone-rows.sh

      - name: Upload per-row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-rows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/standalone-rows/
          if-no-files-found: warn

  compositor_rows:
    name: Scottland 0.4 compositor rows (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare compositor environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker pull archlinux:base-devel
          base_ref="$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'SCOTTLAND_BASE_IMAGE_DIGEST=%s\n' "$base_ref" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --build-arg BASE_REF="$base_ref" \
            --tag scottland-checks:compositor - <<'DOCKERFILE'
          ARG BASE_REF
          FROM ${BASE_REF}
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus foot gdk-pixbuf2 git glm grim gtk4 gtk4-layer-shell hyprland imagemagick inotify-tools jq \
                libglvnd libinput libxkbcommon lua mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wf-recorder wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE
          printf 'Container base image: %s\n' "$base_ref"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:compositor --format '{{.Id}}')"

      - name: Run compositor rows
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
            echo 'Could not enable user namespaces; the compositor preflight will report availability' >&2
          fi
          bash .github/scripts/compositor-rows.sh "${{ matrix.shard }}" 4

      - name: Upload compositor row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-rows-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/compositor-rows/shard-${{ matrix.shard }}/identity.txt
            build/compositor-rows/shard-${{ matrix.shard }}/preflight.log
            build/compositor-rows/shard-${{ matrix.shard }}/preflight/goo-state.json
            build/compositor-rows/shard-${{ matrix.shard }}/rows.tsv
            build/compositor-rows/shard-${{ matrix.shard }}/logs/*.log
          if-no-files-found: error
