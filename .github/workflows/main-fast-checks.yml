name: Scottland main fast checks

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Scottland 0.3 build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --tag scottland-checks:main - <<'DOCKERFILE'
          FROM archlinux:base-devel
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:main --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:main \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Build plugin and command tools
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:main \
            bash -euo pipefail -c '
              git rev-parse HEAD
              make test-hooks
            '

  unit:
    name: Scottland 0.3 unit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --tag scottland-checks:main - <<'DOCKERFILE'
          FROM archlinux:base-devel
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                lua quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci
          DOCKERFILE
          printf 'Container base image: %s\n' "$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:main --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:main \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
            '

      - name: Run the unit suite
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:main \
            bash -euo pipefail -c '
              git rev-parse HEAD
              make tools-test
              tests/inertia-unit.sh
              tests/navigation-unit.sh
              tests/pairing-unit.sh
              tests/peek-unit.sh
              tests/rail-make-room-unit.sh
              tests/spread-unit.sh
              tests/windowing-unit.sh
              python3 tests/omarchy-luahost-noop-list-test.py
              python3 tests/output-scale-unit.py
              mkdir -p build
              g++ -std=c++17 -Wall -Wextra -Werror -O2 -Icore/plugin/src \
                tests/cycle-spring-unit.cpp -o build/cycle-spring-unit
              build/cycle-spring-unit
            '

  headless:
    name: Scottland 0.3 headless
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out Omarchy source for monitor checks
        uses: actions/checkout@v4
        with:
          repository: basecamp/omarchy
          ref: ac2690cd7be4f47e4a255f5e2e78d904d436b068
          path: omarchy-source
          persist-credentials: false

      - name: Prepare build environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --tag scottland-checks:main - <<'DOCKERFILE'
          FROM archlinux:base-devel
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim gtk4 inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                lua quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE
          printf 'Container base image: %s\n' "$(docker image inspect archlinux:base-devel --format '{{index .RepoDigests 0}}')"
          printf 'Prepared container image: %s\n' "$(docker image inspect scottland-checks:main --format '{{.Id}}')"

      - name: Report toolchain versions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            scottland-checks:main \
            bash -euo pipefail -c '
              printf "Container operating system: "
              . /etc/os-release
              printf "%s %s\n" "$NAME" "$VERSION_ID"
              pacman -Q wayfire wlroots0.20 meson gcc rust python bubblewrap quickshell gtk4
              printf "C++ compiler: "
              g++ --version | sed -n "1p"
              rustc --version
              cargo --version
              python3 --version
              pkg-config --modversion wlroots-0.20
              bwrap --version
            '

      - name: Run the headless check
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            --env SCOTTLAND_HEADLESS_ISOLATION=1 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:main \
            bash -euo pipefail -c '
              mkdir -m 700 -p "$XDG_RUNTIME_DIR"
              git rev-parse HEAD
              make test-hooks
              mkdir -m 700 build/main-headless-scratch
              SCOTTLAND_WIDGET_SCOPE=0 \
                SCOTTLAND_TEST_SCRATCH="$PWD/build/main-headless-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/main-headless-scratch/session" \
                timeout --signal=TERM --kill-after=30s 6m tests/hint-background-opacity-test.sh
              rmdir -- build/main-headless-scratch
              mkdir -m 700 build/config-watch-scratch
              SCOTTLAND_TEST_SCRATCH="$PWD/build/config-watch-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/config-watch-scratch/session" \
                timeout --signal=TERM --kill-after=30s 2m \
                tests/config-watch-missing-settings-test.sh "$PWD/build/config-watch-evidence"
              rmdir -- build/config-watch-scratch
              printf "Omarchy source commit: "
              git -C omarchy-source rev-parse HEAD
              printf "Omarchy source tree: "
              git -C omarchy-source rev-parse HEAD^{tree}
              test "$(git -C omarchy-source rev-parse HEAD)" = ac2690cd7be4f47e4a255f5e2e78d904d436b068
              test "$(git -C omarchy-source rev-parse HEAD^{tree})" = 43fbdfc8e861ea5a2d9864e9c7cad279da98e974
              mkdir -m 700 build/omarchy-monitors-scratch
              mkdir -m 700 build/omarchy-monitors-scratch/tmp
              mkdir -m 700 build/omarchy-monitors-scratch/runtime
              console_log="$PWD/build/omarchy-monitors-console.log"
              if OMARCHY_PATH="$PWD/omarchy-source" \
                SCOTTLAND_HEADLESS_ISOLATION=0 \
                SCOTTLAND_TEST_SCRATCH="$PWD/build/omarchy-monitors-scratch" \
                SCOTTLAND_HEADLESS_DIR="$PWD/build/omarchy-monitors-scratch/session" \
                SCOTTLAND_SESSION_DIR="$PWD/build/omarchy-monitors-scratch/runtime/scottland" \
                XDG_RUNTIME_DIR="$PWD/build/omarchy-monitors-scratch/runtime" \
                timeout --signal=TERM --kill-after=30s 6m \
                python3 tests/omarchy-monitors-test.py >"$console_log" 2>&1; then
                cat "$console_log"
              else
                test_status=$?
                cat "$console_log"
                exit "$test_status"
              fi
            '

  focused-mouse-middle:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    name: Scottland mouse middle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare focused test environment
        run: |
          printf 'Hosted machine image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker build --pull \
            --build-arg CI_UID="$(id -u)" \
            --tag scottland-checks:mouse-middle - <<'DOCKERFILE'
          FROM archlinux:base-devel
          ARG CI_UID
          RUN pacman -Syu --noconfirm --needed \
                archlinux-keyring bubblewrap dbus gdk-pixbuf2 git glm grim gtk4 inotify-tools jq \
                libglvnd libinput libxkbcommon mesa meson ninja pkgconf python python-cairo python-dbus python-gobject \
                quickshell rust shadow wayfire wayland wayland-protocols wlroots0.20 cairo \
            && useradd --uid "$CI_UID" --gid 0 --create-home ci \
            && install -d -m 0700 -o ci -g 0 "/run/user/$CI_UID"
          DOCKERFILE

      - name: Build and run focused mouse/touchpad behavior check
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged \
            --user "$(id -u):$(id -g)" \
            --env HOME=/home/ci \
            --env XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            --env SCOTTLAND_HEADLESS_ISOLATION=1 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            scottland-checks:mouse-middle \
            bash -euo pipefail -c '
              mkdir -m 700 -p "$XDG_RUNTIME_DIR"
              git rev-parse HEAD
              make test-hooks
              timeout --signal=TERM --kill-after=30s 6m tests/mouse-middle-move-test.sh
            '
